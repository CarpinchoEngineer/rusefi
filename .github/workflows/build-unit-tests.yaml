name: Linux UT compiler cache experiment
'on': workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  control:
    name: control
    runs-on: ${{ github.repository == 'CarpinchoEngineer/rusefi' && 'blacksmith-4vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-java
    - name: Checkout Submodules Without ChibiOS
      uses: ./.github/actions/submodule-init
      with:
        chibios: 'false'
    - name: Discover cores
      run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'
    - name: Install required software (ubuntu)
      run: 'sudo bash misc/actions/add-ubuntu-latest-apt-mirrors.sh

        sudo bash misc/actions/ubuntu-install-tools.sh

        bash misc/actions/install-gcovr.sh

        bash misc/actions/install-valgrind.sh

        '
    - name: Print bash version
      run: bash --version
    - name: Test Java Compiler
      run: javac -version
    - name: Print Compiler version
      run: gcc -v
    - name: Test STM32 flash and OpenBLT drivers
      run: python3 unit_tests/stm32_flash/test_flash.py
    - name: Handle docs-enums separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 docs-enums
    - name: Handle configs separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 config
    - name: Build Tests
      working-directory: ./unit_tests/
      run: 'TIMEFORMAT=%R

        time make -j4 COVERAGE=yes

        '
    - name: Build Tests again to assert incremental
      working-directory: ./unit_tests/
      run: 'TIMEFORMAT=%R

        timeout 30s make -j4 COVERAGE=yes

        '
    - name: Run Tests
      working-directory: ./unit_tests/
      run: ASAN_OPTIONS=detect_stack_use_after_return=1 build/rusefi_test
    - name: Generate Code Coverage
      working-directory: ./unit_tests/
      run: ./ci_gcov.sh
    - name: Report code coverage
      uses: ./.github/actions/unit-test-coverage-report
      with:
        coverage_xml_path: unit_tests/gcov_working_area/gcov/coverage.xml
        artifact_upload_path: ./unit_tests/gcov_working_area/gcov
        baseline_workflow_file: build-unit-tests.yaml
        artifact_name: coverage-control
        is_pull_request: 'false'
        post_pr_comment: 'false'
    - name: Rebuild Tests For Valgrind
      working-directory: ./unit_tests/
      run: 'make clean

        ./make_for_valgrind.sh

        '
    - name: Run Tests (Valgrind)
      working-directory: ./unit_tests/
      env:
        RUSEFI_SKIP_REPLAY_LOGS: '1'
      run: ./run_with_valgrind.sh
  cold:
    name: cold
    runs-on: ${{ github.repository == 'CarpinchoEngineer/rusefi' && 'blacksmith-4vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-java
    - name: Checkout Submodules Without ChibiOS
      uses: ./.github/actions/submodule-init
      with:
        chibios: 'false'
    - name: Discover cores
      run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'
    - name: Install required software (ubuntu)
      run: 'sudo bash misc/actions/add-ubuntu-latest-apt-mirrors.sh

        sudo bash misc/actions/ubuntu-install-tools.sh

        bash misc/actions/install-gcovr.sh

        bash misc/actions/install-valgrind.sh


        sudo apt-get install -y ccache

        ccache --version

        echo /usr/lib/ccache >> "$GITHUB_PATH"

        '
    - name: Print bash version
      run: bash --version
    - name: Test Java Compiler
      run: javac -version
    - name: Print Compiler version
      run: gcc -v
    - name: Test STM32 flash and OpenBLT drivers
      run: python3 unit_tests/stm32_flash/test_flash.py
    - name: Select coverage cache
      run: 'root="$HOME/.cache/rusefi-ut-bench"

        mkdir -p "$root/coverage" "$root/memcheck"

        echo "CCACHE_DIR=$root/coverage" >> "$GITHUB_ENV"

        echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

        command -v gcc | grep -Fx /usr/lib/ccache/gcc

        command -v g++ | grep -Fx /usr/lib/ccache/g++

        CCACHE_DIR="$root/coverage" ccache -z

        CCACHE_DIR="$root/memcheck" ccache -z'
    - name: Handle docs-enums separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 docs-enums
    - name: Handle configs separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 config
    - name: Build Tests
      working-directory: ./unit_tests/
      run: 'TIMEFORMAT=%R

        time make -j4 COVERAGE=yes

        '
    - name: Build Tests again to assert incremental
      working-directory: ./unit_tests/
      run: 'TIMEFORMAT=%R

        timeout 30s make -j4 COVERAGE=yes

        '
    - name: Run Tests
      working-directory: ./unit_tests/
      run: ASAN_OPTIONS=detect_stack_use_after_return=1 build/rusefi_test
    - name: Generate Code Coverage
      working-directory: ./unit_tests/
      run: ./ci_gcov.sh
    - name: Report code coverage
      uses: ./.github/actions/unit-test-coverage-report
      with:
        coverage_xml_path: unit_tests/gcov_working_area/gcov/coverage.xml
        artifact_upload_path: ./unit_tests/gcov_working_area/gcov
        baseline_workflow_file: build-unit-tests.yaml
        artifact_name: coverage-cold
        is_pull_request: 'false'
        post_pr_comment: 'false'
    - name: Coverage cache statistics
      run: 'ccache -s -v

        du -sh "$CCACHE_DIR"

        echo "CCACHE_DIR=$HOME/.cache/rusefi-ut-bench/memcheck" >> "$GITHUB_ENV"'
    - name: Rebuild Tests For Valgrind
      working-directory: ./unit_tests/
      run: 'make clean

        ./make_for_valgrind.sh

        '
    - name: Run Tests (Valgrind)
      working-directory: ./unit_tests/
      env:
        RUSEFI_SKIP_REPLAY_LOGS: '1'
      run: ./run_with_valgrind.sh
    - name: Memcheck cache statistics
      run: 'ccache -s -v

        du -sh "$CCACHE_DIR"'
    - name: Save compiler caches
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/rusefi-ut-bench
        key: ut-ccache-${{ github.run_id }}-${{ github.run_attempt }}
  warm:
    name: warm
    runs-on: ${{ github.repository == 'CarpinchoEngineer/rusefi' && 'blacksmith-4vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-java
    - name: Checkout Submodules Without ChibiOS
      uses: ./.github/actions/submodule-init
      with:
        chibios: 'false'
    - name: Discover cores
      run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'
    - name: Install required software (ubuntu)
      run: 'sudo bash misc/actions/add-ubuntu-latest-apt-mirrors.sh

        sudo bash misc/actions/ubuntu-install-tools.sh

        bash misc/actions/install-gcovr.sh

        bash misc/actions/install-valgrind.sh


        sudo apt-get install -y ccache

        ccache --version

        echo /usr/lib/ccache >> "$GITHUB_PATH"

        '
    - name: Print bash version
      run: bash --version
    - name: Test Java Compiler
      run: javac -version
    - name: Print Compiler version
      run: gcc -v
    - name: Test STM32 flash and OpenBLT drivers
      run: python3 unit_tests/stm32_flash/test_flash.py
    - name: Restore compiler caches
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/rusefi-ut-bench
        key: ut-ccache-${{ github.run_id }}-${{ github.run_attempt }}
        fail-on-cache-miss: 'true'
    - name: Select coverage cache
      run: 'root="$HOME/.cache/rusefi-ut-bench"

        mkdir -p "$root/coverage" "$root/memcheck"

        echo "CCACHE_DIR=$root/coverage" >> "$GITHUB_ENV"

        echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

        command -v gcc | grep -Fx /usr/lib/ccache/gcc

        command -v g++ | grep -Fx /usr/lib/ccache/g++

        CCACHE_DIR="$root/coverage" ccache -z

        CCACHE_DIR="$root/memcheck" ccache -z'
    - name: Handle docs-enums separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 docs-enums
    - name: Handle configs separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 config
    - name: Build Tests
      working-directory: ./unit_tests/
      run: 'TIMEFORMAT=%R

        time make -j4 COVERAGE=yes

        '
    - name: Build Tests again to assert incremental
      working-directory: ./unit_tests/
      run: 'TIMEFORMAT=%R

        timeout 30s make -j4 COVERAGE=yes

        '
    - name: Run Tests
      working-directory: ./unit_tests/
      run: ASAN_OPTIONS=detect_stack_use_after_return=1 build/rusefi_test
    - name: Generate Code Coverage
      working-directory: ./unit_tests/
      run: ./ci_gcov.sh
    - name: Report code coverage
      uses: ./.github/actions/unit-test-coverage-report
      with:
        coverage_xml_path: unit_tests/gcov_working_area/gcov/coverage.xml
        artifact_upload_path: ./unit_tests/gcov_working_area/gcov
        baseline_workflow_file: build-unit-tests.yaml
        artifact_name: coverage-warm
        is_pull_request: 'false'
        post_pr_comment: 'false'
    - name: Coverage cache statistics
      run: 'ccache -s -v

        du -sh "$CCACHE_DIR"

        echo "CCACHE_DIR=$HOME/.cache/rusefi-ut-bench/memcheck" >> "$GITHUB_ENV"'
    - name: Rebuild Tests For Valgrind
      working-directory: ./unit_tests/
      run: 'make clean

        ./make_for_valgrind.sh

        '
    - name: Run Tests (Valgrind)
      working-directory: ./unit_tests/
      env:
        RUSEFI_SKIP_REPLAY_LOGS: '1'
      run: ./run_with_valgrind.sh
    - name: Memcheck cache statistics
      run: 'ccache -s -v

        du -sh "$CCACHE_DIR"'
    needs: cold
