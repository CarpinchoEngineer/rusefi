name: Firmware on Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.1
        with:
          release: '14.2.Rel1'

      - name: Checkout Submodules
        # [tag:submodule_auth] see .github/actions/submodule-init/action.yml (bash also runs on Windows runners)
        uses: ./.github/actions/submodule-init
        with:
          token: ${{ secrets.MY_REPO_PAT }}

      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@v7

      - name: Disable Cygwin POSIX ACLs
        # Blacksmith Windows runners: files created by Cygwin tools (e.g. the PCH copy) otherwise
        # get ACLs that native Windows compilers cannot read ("pch.h: Permission denied")
        run: Set-Content -Path C:\cygwin\etc\fstab -Value 'none /cygdrive cygdrive binary,noacl,posix=0,user 0 0'

      - name: Print bash version
        run: bash --version

      - name: Test Java Compiler
        run: javac -version

      - name: Print arm GCC version
        run: arm-none-eabi-gcc -v

      - name: Print make version
        run: make -v

      - name: Compile Firmware
        working-directory: firmware
        run: make -j4

      - name: Upload failed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-firmware-diagnostics
          path: |
            firmware/build/rusefi.map
            firmware/build/rusefi.elf
          if-no-files-found: warn
          retention-days: 14
