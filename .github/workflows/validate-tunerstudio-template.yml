name: Validate TunerStudio INI

on:
  push:
    branches: [ master ]
    paths:
      - 'firmware/tunerstudio/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'firmware/tunerstudio/**'

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2604

    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run INI Validation
        run: |
          python firmware/tunerstudio/validate_ini.py firmware/tunerstudio/tunerstudio.template.ini