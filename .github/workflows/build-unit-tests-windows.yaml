name: Unit Tests on Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-java

    - name: Checkout Submodules
# todo: some funny way to reuse common_submodule_init_without_chibios.sh on Windows?
      run: |
        git submodule update --init --depth=1 unit_tests/googletest
        git submodule update --init --depth=1 firmware/libfirmware
        git submodule update --init --depth=1 firmware/ext/lua
        git submodule update --init --depth=1 firmware/controllers/lua/luaaa
        git submodule update --init --depth=1 firmware/controllers/can/wideband_firmware
        git submodule update --init --depth=1 java_console/peak-can-basic
        git submodule update --init --depth=1 firmware/ext/magic_enum

    - name: Set up Cygwin
      uses: cygwin/cygwin-install-action@v7

    - name: Disable Cygwin POSIX ACLs
      # Blacksmith Windows runners: files created by Cygwin tools (e.g. the PCH copy) otherwise
      # get ACLs that native Windows compilers cannot read ("pch.h: Permission denied")
      run: Set-Content -Path C:\cygwin\etc\fstab -Value 'none /cygdrive cygdrive binary,noacl,posix=0,user 0 0'

    - name: Print bash version
      run: bash --version

    - name: Test Java Compiler
      run: javac -version

    - name: Print GCC version
      run: gcc -v

    - name: Print make version
      run: make -v

    - name: Test STM32 flash and OpenBLT drivers
      run: python3 unit_tests/stm32_flash/test_flash.py

    - name: Handle docs-enums separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 docs-enums

    - name: Handle configs separately just to make github logs more readable
      working-directory: ./unit_tests/
      run: make -j4 config

    - name: Compile
      working-directory: unit_tests
      run: make -j4

    - name: Run Tests on Windows
      working-directory: unit_tests
      run: build/rusefi_test.exe
